aid: workfront
name: Adobe Workfront
description: 'Adobe Workfront is Adobe''s enterprise work-management platform for marketing and creative
  operations — project and portfolio planning, request intake, task and resource management, proofing
  and approvals, timesheets, financial tracking and reporting — sold in Select, Prime and Ultimate
  packages. Its developer surface is unusually wide for a work-management vendor: a versioned REST core
  API at /attask/api (v22.0, 174 objects exposed through an anonymous object-metadata endpoint), the
  separately versioned Workfront Planning API published as first-party OpenAPI 3.0.1 and 3.1.0 documents
  on developer.adobe.com, an Event Subscription API that pushes object change events to customer
  webhook endpoints, a Document Webhooks API third-party document providers implement, and — since June
  2026 — a hosted Model Context Protocol server at mcp.workfront.adobe.com exposing 87 documented tools
  behind OAuth 2.1, plus first-party agent Skills published in the adobe/skills repository.'
url: https://raw.githubusercontent.com/api-evangelist/workfront/refs/heads/main/apis.yml
image: https://avatars.githubusercontent.com/u/3494194?v=4
