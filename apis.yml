apis:
- aid: workfront:workfront-api
  name: Adobe Workfront API
  description: >-
    The core Workfront REST API. Every object in the system has a URI of the form /attask/api/v22.0/{objCode}/{id};
    GET retrieves or searches, POST inserts, PUT edits and DELETE removes. Adobe does not publish an OpenAPI
    document for this API — the machine-readable contract is an object-metadata endpoint that returns
    all 174 objects with their fields, references, collections, searchable fields, named queries, actions
    and supported operations, and which answers anonymously for the public reference instance.
  humanURL: >-
    https://experienceleague.adobe.com/en/docs/workfront/using/adobe-workfront-api/api-general-information/api-basics
  baseURL: https://{customer-domain}.my.workfront.adobe.com/attask/api/v22.0
  tags:
  - Work Management
  - Project Management
  - REST
  properties:
  - type: Documentation
    url: >-
      https://experienceleague.adobe.com/en/docs/workfront/using/adobe-workfront-api/api-general-information/api-general
  - type: APIReference
    url: https://developersupport.workfront.com/page-api-explorer.html
  - type: GettingStarted
    url: >-
      https://experienceleague.adobe.com/en/docs/workfront/using/adobe-workfront-api/api-general-information/api-basics
  - type: ObjectMetadata
    url: data-model/workfront-api-v22-object-metadata.json
  - type: DataModel
    url: data-model/workfront-data-model.yml
- aid: workfront:workfront-event-subscription-api
  name: Adobe Workfront Event Subscription API
  description: >-
    The Workfront webhook/event surface. A system administrator registers a subscription for an object
    type (objCode) and event type (CREATE, UPDATE, DELETE) with a destination URL and auth token; Workfront
    then POSTs a JSON message carrying oldState, newState and eventTime to that endpoint, typically within
    one second of the change being logged. 30 object types are supported.
  humanURL: >-
    https://experienceleague.adobe.com/en/docs/workfront/using/adobe-workfront-api/event-subscriptions/event-subs-api
  baseURL: https://{customer-domain}.my.workfront.adobe.com/attask/eventsubscription/api/v1
  tags:
  - Webhook
  - Event
  - Work Management
  tags_raw:
  - Webhooks
  - Events
  - Work Management
  properties:
  - type: Webhooks
    url: asyncapi/workfront-event-subscriptions-webhooks.yml
  - type: Documentation
    url: >-
      https://experienceleague.adobe.com/en/docs/workfront/using/adobe-workfront-api/event-subscriptions/event-subs-api
- aid: workfront:workfront-mcp-server
  name: Adobe Workfront MCP Server
  description: >-
    Adobe's hosted Model Context Protocol server for Workfront, generally available since June 2026. It
    exposes 87 documented tools across three families — Approvals (documents, approval workflows, reminders,
    templates, lookups), Planning (workspaces, record types, records, fields, views, templates) and Workflow/Insights
    (generic object CRUD and reporting over the core API) — to any MCP-compatible agent. Access is OAuth
    2.1 with PKCE and dynamic client registration against Adobe IMS; a Workfront administrator must enable
    MCP access for the instance first.
  humanURL: >-
    https://experienceleague.adobe.com/en/docs/workfront/using/basics/workfront-mcp-server/workfront-mcp-server-overview
  baseURL: https://mcp.workfront.adobe.com/mcp/v1/workfront
  tags:
  - MCP
  - Agents
  - Work Management
  tags_raw:
  - Model Context Protocol
  - Agents
  - Work Management
  properties:
  - type: MCPServer
    url: mcp/workfront-mcp.yml
  - type: ToolCrosswalk
    url: mcp/workfront-tool-crosswalk.yml
  - type: Documentation
    url: >-
      https://experienceleague.adobe.com/en/docs/workfront/using/basics/workfront-mcp-server/workfront-mcp-server-tools
- aid: workfront:workfront-fields-api
  name: Adobe Workfront Fields API
  description: >-
    Field management. Per-record-type quotas: max 500 fields total; max 20 PARAGRAPH (long-text) fields;
    max 20 FORMULA fields; max 30 REFERENCE fields. Field display names must be unique within a record
    type and capped at 256 characters. Formula expressions: max 50,000 characters; lookup depth: max 5.
  humanURL: >-
    https://experienceleague.adobe.com/en/docs/workfront/using/adobe-workfront-api/api-general-information/api-basics
  baseURL: https://{customer-domain}.my.workfront.adobe.com/attask/api/v22.0
