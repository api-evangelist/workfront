format: rfc9457
note: 'The Workfront Planning API v2 declares an RFC 7807/9457 problem-details envelope (components.schemas.V2ProblemDetail)
  on all 233 of its 4xx/5xx responses, with a required errorCode, requestId and title/status/detail. Adobe documents
  errorCode — not the HTTP status — as the field to branch on. Planning v1 declares NO error responses at all
  in its OpenAPI, and uses a numeric `type` (e.g. 40001) with a nested `report` object instead. The core Workfront
  /attask API has no OpenAPI and no problem-details envelope; it returns {"error": {...}} and is recorded separately
  below.'
