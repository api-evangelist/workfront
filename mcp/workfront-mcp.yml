tools:
- name: approvals_find_document_version_by_name
  title: Find document version by name
  family: Approvals tools / Documents
  action: read
  description: Looks up a document's current version ID by filename. Supports partial matches.
- name: approvals_get_document_by_version_id
  title: Get document by version ID
  family: Approvals tools / Documents
  action: read
  description: Fetches document details (name, size, upload date, uploader) for a known document version
