- name: approvals_get_documents_by_project
  title: Get documents by project
  family: Approvals tools / Documents
  action: read
  description: Lists documents inside a Workfront project, with each document's current version ID.
- name: approvals_resolve_document_scope
  title: Resolve document scope
  family: Approvals tools / Documents
  action: read
  description: Expands a project or folder into the list of document version IDs it contains. Supports
    project, folder, and folder-by-name scopes.
- name: approvals_find_document
  title: Find a document
  family: Approvals tools / Documents
  action: read
  description: Look up a document by filename or document version ID
- name: approvals_get_documents_by_scope
  title: Get documents by scope
  family: Approvals tools / Documents
  action: read
  description: List document inside a project or folder.
- name: approvals_get_approval_info
  title: Get approval workflow info
  family: Approvals tools / Approval workflows
  action: read
  description: Returns the current approval workflow (stages, participants, status) for a document version.
    For approvals with multiple paths, it shows each path and its stages.
- name: approvals_create_or_update_approval_workflow
  title: Create or update approval workflow
  family: Approvals tools / Approval workflows
  action: write
  description: Creates or updates the approval workflow stages for a document version. Supports a single
    track of stages or multiple parallel review paths.
- name: approvals_create_approval_from_template
  title: Create approval from template
  family: Approvals tools / Approval workflows
  action: write
  description: Creates an approval workflow on a document using an existing template, including templates
    that define multiple parallel paths.
- name: approvals_delete_approval_stage
  title: Delete approval stage
  family: Approvals tools / Approval workflows
  action: write
  description: Deletes a single stage from an approval workflow by name or position. Only not-started
    stages can be deleted.
- name: approvals_add_path_to_approval
  title: Add path to approval
  family: Approvals tools / Approval workflows
  action: write
  description: Adds a new parallel review path to an existing approval workflow, so multiple review tracks
    run at the same time on a document version.
- name: approvals_remove_path_from_approval
  title: Remove path from approval
  family: Approvals tools / Approval workflows
  action: write
  description: Removes a parallel path from an approval workflow. The first path can't be removed, and
    paths that contain completed or locked stages are protected.
- name: approvals_add_stage_to_path
  title: Add stage to path
  family: Approvals tools / Approval workflows
  action: write
  description: Adds a review stage to the end of a specific path within a parallel approval workflow.
- name: approvals_remove_stage_from_path
  title: Remove stage from path
  family: Approvals tools / Approval workflows
  action: write
  description: Removes a not-started stage from a specific path in a parallel approval workflow. Each
    path must keep at least one stage.
- name: approvals_reorder_stages_in_path
  title: Reorder stages in path
  family: Approvals tools / Approval workflows
  action: write
  description: Changes the order of stages within a single path of a parallel approval workflow.
- name: approvals_send_reminder_to_participants
  title: Send reminder to participants
  family: Approvals tools / Reminders
  action: write
  description: Sends reminder emails to specific participants in an approval stage. Works only for started,
    not-completed, not-locked stages.
- name: approvals_send_reminder_to_undecided
  title: Send reminder to undecided participants
  family: Approvals tools / Reminders
  action: write
  description: Sends reminder emails to all undecided participants (notified, opened, or commented) in
    an approval stage.
