  /v2/record-types/{recordTypeId}/records/move:
    post:
      tags:
      - Records
      summary: Move Records
      description: 'Reorder one or more records within a record type by specifying where to place them. Provide exactly one of putAfterRecordId (place after) or putBeforeRecordId (place before). Maximum 100 records per request. Requires EDIT permission on the record type. Move is all-or-nothing: on failure, no records are reordered.'
      operationId: moveRecords
      parameters:
      - name: recordTypeId
        in: path
        description: ID of the record type
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveRecordsRequestDto'
        required: true
      responses:
        '200':
          description: All items moved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordBulkResponseDto'
        '207':
          description: Move failed — all records remain in original positions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordBulkResponseDto'
        '400':
          description: Bad Request (invalid move request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2ProblemDetail'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2ProblemDetail'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2ProblemDetail'
        '404':
          description: Record Type or anchor record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2ProblemDetail'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2ProblemDetail'
    servers:
