components:
  schemas:
    RecordSearchDto:
      type: object
      properties:
        recordTypeId:
          type: string
        recordTypeAlias:
          type: string
        filters:
          $ref: '#/components/schemas/JsonNode'
        groupingFieldIds:
          type: array
          items:
            type: string
        sorting:
          type: array
          items:
            $ref: '#/components/schemas/RecordSorting'
        offset:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
        rowOrderViewId:
          type: string
    GroupedRecordsDto:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/RecordDto'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/RecordGroupDto'
        totalCount:
          type: integer
          format: int32
    RecordExternalOptions:
      type: object
      properties:
        connection:
          type: string
          enum:
          - WORKFRONT
          - AEM
        object:
          type: string
          enum:
          - PROJECT
          - PORTFOLIO
          - PROGRAM
          - COMPANY
          - GROUP
          - ASSET
        externalId:
          type: string
        connectionOptions:
          type: object
          additionalProperties:
            type: object
        link:
          type: string
    RecordDto:
      type: object
      properties:
        id:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
        updatedBy:
          type: string
        updatedAt:
          type: string
        customerId:
          type: string
        imsOrgId:
          type: string
        recordTypeId:
          type: string
        data:
          type: object
          additionalProperties:
            type: object
        recordExternalOptions:
          $ref: '#/components/schemas/RecordExternalOptions'
        thumbnailUrl:
          type: string
          readOnly: true
        coverImage:
          $ref: '#/components/schemas/CoverImage'
    RecordGroupDto:
      type: object
      properties:
        fieldId:
          type: string
        value:
          type: object
        recordIds:
          type: array
          items:
            type: string
    CoverImage:
      type: object
      properties:
        url:
          type: string
        position:
          type: integer
          format: int32
      readOnly: true
    RecordSorting:
      type: object
      properties:
        fieldId:
          type: string
        direction:
          type: string
          enum:
          - asc
          - desc
    JsonNode:
      type: object
    RecordBulkResponseDto:
      type: object
      description: Response envelope for V2 bulk record operations.
      properties:
        status:
          type: string
          description: Overall bulk operation status.
          enum:
          - success
          - partial
          - failed
        total:
          type: integer
          format: int32
          description: Number of input items submitted.
          example: 10
        succeeded:
          type: integer
          format: int32
          description: Number of successful item results.
          example: 3
        failed:
          type: integer
          format: int32
          description: Number of failed item results.
          example: 7
        requestId:
          type: string
          description: Request correlation ID for tracing and support.
          example: 5b1f7a8c-2c0e-4a8f-9c4f-2a3b1c0e4d5f
        errors:
          type: array
          description: Request-level errors affecting multiple items.
          items:
            $ref: '#/components/schemas/RecordBulkRequestErrorDto'
        results:
          type: array
          description: Per-item results in the same order as the input.
          items:
            $ref: '#/components/schemas/RecordBulkResultItemDtoObject'
    MoveRecordsRequestDto:
      type: object
      description: Move request specifying which records to move and where
      properties:
        recordIds:
          type: array
          description: IDs of the records to move, in the order they should appear at the destination.
          example:
          - Rc6796...01
          - Rc6796...02
          items:
            type: string
            minLength: 1
          maxItems: 100
          minItems: 0
        putAfterRecordId:
          type: string
          description: Place the moved records immediately AFTER this record. Mutually exclusive with putBeforeRecordId.
          example: Rc67a1...
        putBeforeRecordId:
          type: string
          description: Place the moved records immediately BEFORE this record. Mutually exclusive with putAfterRecordId.
          example: Rc67a2...
      required:
      - recordIds
    PageableObject:
      type: object
      properties:
        paged:
          type: boolean
        pageSize:
          type: integer
          format: int32
        pageNumber:
          type: integer
          format: int32
        offset:
          type: integer
          format: int64
        sort:
          $ref: '#/components/schemas/SortObject'
        unpaged:
          type: boolean
    RecordBulkRequestErrorDto:
      type: object
      description: Request-level error affecting multiple items in a bulk operation.
      properties:
        code:
          type: string
          description: Machine-readable error code.
          example: RATE_LIMIT_EXCEEDED
        message:
          type: string
          description: Human-readable description of the request-level error.
          example: Bulk operation limit of 100 items per request exceeded; 58 items were skipped
        affectedIds:
          type: array
          description: IDs of the items affected by this request-level error.
          items:
            type: string
    RecordGroupDto_2:
      type: object
      description: Group of records with common field values
      properties:
        fieldId:
          type: string
          description: ID of the field used for grouping
          example: F693ab1c96f11ea3f4175e716
        value:
          description: Value of the grouping field
          example: Active
        recordIds:
          type: array
          description: List of record IDs in this group
          example:
          - R123
          - R456
          - R789
          items:
            type: string
        count:
          type: integer
          format: int32
          description: Count of records in this group
          example: 3
    HistoryEntryDto:
      type: object
      description: A single record field change event
      properties:
        id:
          type: string
          description: Unique identifier of this history entry
        recordId:
          type: string
          description: ID of the record this change belongs to
        createdBy:
          type: string
          description: ID of the user who made the change
        createdAt:
          type: string
          description: ISO-8601 timestamp of when the change occurred
          example: '2026-01-15T10:30:00.000Z'
        fieldId:
          type: string
          description: ID of the field that changed
        before:
          $ref: '#/components/schemas/CellValueDto'
          description: Field state before the change
        after:
          $ref: '#/components/schemas/CellValueDto'
          description: Field state after the change
    GroupDto:
      type: object
      description: Grouping specification
      properties:
        fieldId:
          type: string
          description: ID or alias of the field to group by
          example: F693ab1c96f11ea3f4175e710
          minLength: 1
        direction:
          type: string
          description: Sort direction for the grouped values (asc or desc). Defaults to asc if omitted.
          enum:
          - asc
          - desc
          example: asc
      required:
      - fieldId
    V2ProblemDetail:
      type: object
      description: RFC 7807 Problem Details error response for V2 endpoints.
      properties:
        title:
          type: string
          description: Short, human-readable summary of the error type. Same for all occurrences of the same error.
          example: Not found
        status:
          type: integer
          format: int32
          description: HTTP status code of the response.
          example: 404
        detail:
          type: string
          description: Human-readable, resource-specific explanation of this error occurrence. Always English.
          example: Record type with ID 'Rt69b14f7e' was not found.
        errorCode:
          type: string
          description: Machine-readable error code (enum name).
          example: ENTITY_WITH_ATTRIBUTE_NOT_FOUND
        messageArguments:
          type: object
          additionalProperties:
            type: string
          description: Named parameters used to compose the detail message. Values are always strings.
          example:
            recordTypeId: Rt69b14f7e
        requestId:
          type: string
          description: Request correlation ID for tracing and support.
          example: 5b1f7a8c-2c0e-4a8f-9c4f-2a3b1c0e4d5f
        errors:
          type: array
          description: Field-level or per-item error details. Present for validation, business-rule, or batch failures.
          items:
            $ref: '#/components/schemas/V2FieldError'
      required:
      - detail
      - errorCode
      - requestId
      - status
      - title
    FieldOptionDto:
      type: object
      description: Field option for single-select and multi-select fields
      properties:
        name:
          description: Name identifier for the option
        displayName:
          type: string
          description: Display name for the option
        color:
          type: string
          description: Color code for the option
        groupId:
          type: string
          description: Group ID for grouped options
    FilterCondition:
      type: string
      description: Supported filter conditions for record search
      enum:
      - CONTAINS
      - DOES_NOT_CONTAIN
      - IS
      - IS_NOT
      - IS_EMPTY
      - IS_NOT_EMPTY
      - GREATER_THAN
      - GREATER_THAN_OR_EQUAL
      - LESS_THAN
      - LESS_THAN_OR_EQUAL
      - IS_AFTER
      - IS_BEFORE
      - IS_BETWEEN
      - IS_NOT_BETWEEN
      - IS_ANY_OF
      - IS_NONE_OF
      - HAS_ANY_OF
      - HAS_ALL_OF
      - HAS_NONE_OF
      - IS_EXACTLY
    V2FieldError:
      type: object
      description: Field-level error detail used in validation errors and per-item batch failures.
      properties:
        field:
          type: string
          description: Name of the field or path that caused the error.
          example: name
        message:
          type: string
          description: Human-readable explanation of the error for this field.
          example: Workspace name can not be blank
        code:
          type: string
          description: Machine-readable code identifying the validation rule that failed.
          example: NotBlank
    CoverImageDto:
      type: object
      description: Cover image information for a record
      properties:
        url:
          type: string
          description: URL of the cover image
