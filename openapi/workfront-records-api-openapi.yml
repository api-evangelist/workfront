  /v2/record-types/{recordTypeId}/records/search:
    get:
      tags:
      - Records
      summary: Search Records (GET)
      description: Search records using query parameters. Accepts a JSON filter string using the composite filter pattern, field projection, and alias-based field access. Returns page-based paginated records along with group information.
      operationId: searchRecordsGet
      parameters:
      - name: recordTypeId
        in: path
        description: ID of the record type
        required: true
        schema:
          type: string
      - name: recordTypeAlias
        in: query
        description: Alias of the record type
        required: false
        schema:
          type: string
      - name: aliased
        in: query
        description: Flag to include alias support in response (field keys will be aliases instead of IDs)
        required: false
        schema:
          type: boolean
          default: false
      - name: filter
        in: query
        description: 'JSON filter using the composite filter pattern. Example: {"operator":"AND","conditions":[{"fieldId":"status","condition":"IS","value":"Active"}]}'
        required: false
        schema:
          type: string
      - name: groupingFieldIds
        in: query
        description: List of field IDs to group results by
        required: false
        schema:
          type: array
          items:
            type: string
        example: F693ab1c96f11ea3f4175e000,F693ab1c96f11ea3f4175e001
      - name: scopeWorkspaceIds
        in: query
        description: List of workspace IDs to scope the search to (for global record types)
        required: false
        schema:
          type: array
          items:
            type: string
        example: Ws123,Ws456
      - name: globalRecordTypeWorkspaceFieldId
        in: query
        description: ID of the global record type workspace field (for global record types)
        required: false
        schema:
          type: string
        example: F693ab1c96f11ea3f4175e717
      - name: fieldIds
        in: query
        description: List of field IDs to include in the record's data
        required: false
        schema:
          type: array
          default:
          - '*'
          items:
            type: string
        example: F693ab1c96f11ea3f4175e710,F693ab1c96f11ea3f4175e711
      - name: fieldAliases
        in: query
        description: List of field aliases to include in the record's data
        required: false
        schema:
          type: array
          default:
          - '*'
          items:
            type: string
        example: name,description
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 100
          minimum: 1
      - name: sort
        in: query
        description: 'Sorting criteria in the format: property,(asc|desc). Default sort order is ascending. Multiple sort criteria are supported.'
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordSearchPageDto'
        '400':
          description: Bad Request (invalid filter parameter)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2ProblemDetail'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2ProblemDetail'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2ProblemDetail'
        '404':
          description: Record Type Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2ProblemDetail'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2ProblemDetail'
    post:
      tags:
      - Records
      summary: Search Records (POST)
      description: Search records using the composite filter pattern with strongly-typed conditions. Supports recursive AND/OR filter nesting, sorting, grouping, field projection, and alias-based field access. Returns page-based paginated records along with group information.
      operationId: searchRecordsPost
