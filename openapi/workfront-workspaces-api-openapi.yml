      type: object
      properties:
        connectionName:
          type: string
        objectName:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
    FieldOptionDto:
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
        color:
          type: string
    RecordTypeSectionDto_2:
      type: object
      description: Section for organizing and grouping record types within a workspace. Sections are ordered by their position in the array.
      properties:
        displayName:
          type: string
          description: Display name of the record type section
          example: Marketing
          maxLength: 256
          minLength: 0
        recordTypeIds:
          type: array
          description: List of record type IDs included in this section
          items:
            type: string
      required:
      - displayName
    CursorResponseWorkspaceDto:
      type: object
      description: Cursor-paginated list of workspaces
      properties:
        content:
          type: array
          description: List of workspaces in the current page
          items:
            $ref: '#/components/schemas/WorkspaceBaseDto'
        cursor:
          $ref: '#/components/schemas/CursorInfo'
          description: Cursor metadata for fetching subsequent pages
    V2FieldError:
      type: object
      description: Field-level error detail used in validation errors and per-item batch failures.
      properties:
        field:
          type: string
          description: Name of the field or path that caused the error.
          example: name
        message:
          type: string
          description: Human-readable explanation of the error for this field.
          example: Workspace name can not be blank
        code:
          type: string
          description: Machine-readable code identifying the validation rule that failed.
          example: NotBlank
    WorkspaceBaseDto:
      type: object
      description: Base class for Workspace DTOs containing common workspace properties
      properties:
        id:
          type: string
          description: Unique identifier of the entity
          example: Ws69a976d02587b929c9e26dfa
          readOnly: true
        createdBy:
          $ref: '#/components/schemas/UserReferenceDto'
          description: User who created this entity
          readOnly: true
        createdAt:
          type: string
          description: Date/time when this entity was created
          example: '2026-01-15T10:30:00.000Z'
          pattern: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
          readOnly: true
        updatedBy:
          $ref: '#/components/schemas/UserReferenceDto'
          description: User who last updated this entity
          readOnly: true
        updatedAt:
          type: string
          description: Date/time when this entity was last updated
          example: '2026-01-15T14:45:00.000Z'
          pattern: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
          readOnly: true
        alias:
          type: string
          description: Unique alias identifier for the workspace
          example: marketing-workspace
          readOnly: true
        name:
          type: string
          description: Display name of the workspace. Maximum 256 characters; cannot be blank.
          example: Marketing Workspace
          maxLength: 256
          minLength: 0
          pattern: (?s)^\s*\S.*$
        description:
          type: string
          description: Description of the workspace purpose and content. Maximum 1024 characters.
          example: Workspace for managing marketing campaigns and assets
          maxLength: 1024
          minLength: 0
        color:
          type: string
          description: Color theme for the workspace
          example: blue
        icon:
          type: string
          description: Icon identifier for the workspace
          example: briefcase
        ownerId:
          type: string
          description: User ID of the workspace owner
          example: 1C341E7B682505430A494138@0bd0200063c87f9749412b.e
        recordTypeSections:
          type: array
          description: List of record type sections for organizing record types
          items:
            $ref: '#/components/schemas/RecordTypeSectionDto_2'
    CursorInfo:
      type: object
      description: Cursor pagination metadata
      properties:
        nextCursor:
          type: string
          description: Opaque cursor for fetching the next page. Absent when there are no more pages.
          example: UnQ2OWIxNGY3ZTBlMzhmMzVmMjhjM2NjZWU=
        hasMore:
          type: boolean
          description: Whether more items exist beyond this page
    UserReferenceDto:
      type: object
      description: Reference to a user with identifier and display name
      properties:
        id:
          type: string
          description: Unique identifier of the user
          example: 1C341E7B682505430A494138@0bd0200063c87f9749412b.e
          readOnly: true
        name:
          type: string
          description: Display name of the user
          example: Jane Doe
          readOnly: true
    V2ProblemDetail:
      type: object
      description: RFC 7807 Problem Details error response for V2 endpoints.
      properties:
        title:
          type: string
          description: Short, human-readable summary of the error type. Same for all occurrences of the same error.
          example: Not found
        status:
          type: integer
          format: int32
          description: HTTP status code of the response.
          example: 404
        detail:
          type: string
          description: Human-readable, resource-specific explanation of this error occurrence. Always English.
          example: Record type with ID 'Rt69b14f7e' was not found.
        errorCode:
          type: string
          description: Machine-readable error code (enum name).
          example: ENTITY_WITH_ATTRIBUTE_NOT_FOUND
        messageArguments:
          type: object
          additionalProperties:
            type: string
          description: Named parameters used to compose the detail message. Values are always strings.
          example:
            recordTypeId: Rt69b14f7e
        requestId:
          type: string
          description: Request correlation ID for tracing and support.
          example: 5b1f7a8c-2c0e-4a8f-9c4f-2a3b1c0e4d5f
        errors:
          type: array
          description: Field-level or per-item error details. Present for validation, business-rule, or batch failures.
          items:
            $ref: '#/components/schemas/V2FieldError'
      required:
      - detail
      - errorCode
      - requestId
      - status
      - title
