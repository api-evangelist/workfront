note: 'Workfront''s first-party client libraries live under the @workfront npm scope and are actively
  maintained — @workfront/workfront-api 9.1.0 shipped 2026-07-27, three months after API v22 was
  released, so the SDK is current with the API it wraps. The unscoped legacy names (workfront-api,
  workfront-api-constants, workfront-cookie) are the same libraries at their pre-scope names and are
  effectively frozen; workfront-api-constants last published in 2017. There is no first-party Python,
  Java, Ruby, PHP, Go or .NET SDK — Adobe ships language *code samples* in the Workfront GitHub org
  (Java, Python, C#, PHP, Ruby, Flex) rather than packaged clients, and every one of those sample
  repos was last pushed in 2017-2019.'
